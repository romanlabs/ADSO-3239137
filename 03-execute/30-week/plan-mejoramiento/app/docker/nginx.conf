server {
    listen 5173;
    root /usr/share/nginx/html;

    # Single page app: every route of React Router answers with index.html.
    location / {
        try_files $uri /index.html;
    }

    # Hashed bundles never change, so they can be cached for long.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
