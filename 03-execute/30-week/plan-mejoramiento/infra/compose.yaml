# One command brings up the whole system: docker compose up --build (run from this folder).
# Secrets come from infra/.env, which is never committed; copy .env.example and fill it in.
name: laptops

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: laptops
      POSTGRES_USER: laptops
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laptops -d laptops"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ../api
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY:?set APP_KEY in infra/.env}
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: laptops
      DB_USERNAME: laptops
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in infra/.env}
      DB_SCHEMA: laptops
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/.env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?set ADMIN_USERNAME in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in infra/.env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PHOTOS_DIR: /srv/api/storage/app/photos
      CLOCK_OFFSET_DAYS: ${CLOCK_OFFSET_DAYS:-0}
    volumes:
      - photos:/srv/api/storage/app/photos
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  photos:
